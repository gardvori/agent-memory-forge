[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-forge"
version = "1.0.0"
description = "Unified agent memory system with git-like versioning, compression, and semantic search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "gardvori", email = "gardvori@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
embeddings = ["sentence-transformers>=2.0", "numpy>=1.24.0"]

[project.scripts]
amf = "agent_memory_forge.cli:main"
agent-memory-forge = "agent_memory_forge.cli:main"

[project.urls]
Homepage = "https://github.com/gardvori/agent-memory-forge"
Repository = "https://github.com/gardvori/agent-memory-forge"
